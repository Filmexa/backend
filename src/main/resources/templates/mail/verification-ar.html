<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>تحقق من حساب Filmexa الخاص بك</title>
</head>
<body style="margin:0; padding:0; background-color:#0f0f10; font-family:Tahoma, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f0f10; padding:32px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#1a1a1c; border-radius:12px; overflow:hidden;" dir="rtl">
                    <tr>
                        <td style="padding:32px 40px 8px 40px; text-align:right;">
                            <h1 style="margin:0; font-size:22px; color:#ffffff;">Filmexa</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 40px 0 40px; text-align:right;">
                            <p style="margin:0 0 16px 0; font-size:16px; color:#e5e5e5;">
                                مرحباً <span th:text="${username}">بك</span>،
                            </p>
                            <p style="margin:0 0 24px 0; font-size:15px; line-height:1.8; color:#b3b3b3;">
                                استخدم الرمز أدناه لتفعيل حسابك في Filmexa. تنتهي صلاحية هذا الرمز خلال
                                <span th:text="${expirationMinutes}">15</span> دقيقة.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:0 40px 24px 40px;">
                            <div style="display:inline-block; padding:16px 32px; background-color:#e50914; border-radius:8px;">
                                <span th:text="${code}" style="font-size:28px; font-weight:bold; letter-spacing:6px; color:#ffffff;">000000</span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 40px 32px 40px; text-align:right;">
                            <p style="margin:0; font-size:13px; line-height:1.6; color:#7a7a7a;">
                                إذا لم تطلب هذا، يمكنك تجاهل هذه الرسالة بأمان.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 40px; background-color:#141414; text-align:right;">
                            <p style="margin:0; font-size:12px; color:#5c5c5c;">&copy; Filmexa. جميع الحقوق محفوظة.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
