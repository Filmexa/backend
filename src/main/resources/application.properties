spring.application.name=stream

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# logging.level.org.springframework.security=TRACE

spring.jpa.hibernate.ddl-auto=update

# Seed data (src/main/resources/data.sql), applied after Hibernate builds the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# spring.jpa.hibernate.ddl-auto = create-drop

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# springdoc.swagger-ui.enabled=false

# JWT Configuration
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME}
security.jwt.refresh-expiration-time=${SECURITY_JWT_REFRESH_EXPIRATION_TIME}

# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

security.verification.expiration-minutes=${SECURITY_VERIFICATION_EXPIRATION_MINUTES:15}

# OAuth 42 Configuration
ft.client.id=${OAUTH_42_CLIENT_ID}
ft.client.secret=${OAUTH_42_CLIENT_SECRET}
ft.redirect-uri=${OAUTH_42_REDIRECT_URI}
ft.authorize-url=${OAUTH_42_AUTHORIZE_URL}
ft.token-url=${OAUTH_42_TOKEN_URL}
ft.me-url=${OAUTH_42_ME_URL}

# OAuth Google Configuration
google.client.id=${OAUTH_GOOGLE_CLIENT_ID}
google.client.secret=${OAUTH_GOOGLE_CLIENT_SECRET}
google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI}
google.authorize-url=${OAUTH_GOOGLE_AUTHORIZE_URL}
google.token-url=${OAUTH_GOOGLE_TOKEN_URL}
google.userinfo-url=${OAUTH_GOOGLE_USERINFO_URL}

# OAuth Facebook Configuration
facebook.client.id=${OAUTH_FACEBOOK_CLIENT_ID}
facebook.client.secret=${OAUTH_FACEBOOK_CLIENT_SECRET}
facebook.redirect-uri=${OAUTH_FACEBOOK_REDIRECT_URI}
facebook.authorize-url=${OAUTH_FACEBOOK_AUTHORIZE_URL}
facebook.token-url=${OAUTH_FACEBOOK_TOKEN_URL}
facebook.userinfo-url=${OAUTH_FACEBOOK_USERINFO_URL}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Refresh-token cookie (set to true once served over HTTPS)
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.name=${APP_COOKIE_NAME:filmexa_token}

# Storage
app.img-storage-path=${IMG_STORAGE_PATH}
app.video-storage-path=${VIDEO_STORAGE_PATH:./data/movies}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#TMDB
tmdb.access-token=${TMDB_ACCESS_TOKEN}
tmdb.base-url=${TMDB_BASE_URL}
tmdb.base-image-url=${TMDB_IMAGE_BASE_URL}


# YTS
yts.base-url=${YTS_BASE_URL}

# PIRATBAY
piratebay.base-url=${PIRATEBAY_BASE_URL}
=======
# Streaming / transcoding
app.stream.segment-seconds=${STREAM_SEGMENT_SECONDS:6}
app.stream.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
app.stream.ffprobe-path=${FFPROBE_PATH:ffprobe}
app.stream.preset=${STREAM_PRESET:veryfast}
app.stream.max-concurrent-transcodes=${STREAM_MAX_TRANSCODES:4}
app.stream.transcode-timeout-seconds=${STREAM_TRANSCODE_TIMEOUT:120}
app.stream.probe-timeout-seconds=${STREAM_PROBE_TIMEOUT:30}
app.stream.token-secret=${STREAM_TOKEN_SECRET:${SECURITY_JWT_SECRET_KEY}}
app.stream.token-ttl-minutes=${STREAM_TOKEN_TTL_MINUTES:180}
# How many seconds of video must already be on disk ahead of a requested segment
app.stream.readahead-seconds=${STREAM_READAHEAD_SECONDS:15}

# Cleanup: movies unwatched for this long are erased (42 subject: one month)
app.cleanup.retention-days=${CLEANUP_RETENTION_DAYS:30}
app.cleanup.cron=${CLEANUP_CRON:0 0 3 * * *}

app.magnet.fallback=${MAGNET_FALLBACK:big-buck-bunny}
