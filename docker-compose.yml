
services:

  postgres:
    image: postgres:15
    container_name: filmexa-postgres
    restart: always
    env_file:
      - ./.env

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared-network
  
  backend:
    image: mbaanni/filmexa-backend:latest
    container_name: filmexa-backend
    restart: always

    env_file:
      - ./.env
    volumes:
      # Downloaded movies + the transcoded HLS cache must survive container
      # restarts, otherwise every redeploy re-downloads and re-encodes.
      - movie_data:/data/movies
    depends_on:
      - postgres
    networks:
      - shared-network
volumes:
  postgres_data:
  movie_data:

networks:
  shared-network:
    external: true
    name: filmexa-net
