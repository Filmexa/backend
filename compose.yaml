name: filmexa-dev

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: filmexa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filmexa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/filmexa_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      IMG_STORAGE_PATH: /data/images
      VIDEO_STORAGE_PATH: /data/movies
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"
      - "6891-6896:6891-6896/tcp"
      - "49001-49006:49001-49006/udp"
    volumes:
      - .:/app
      - maven_cache:/root/.m2
      - movie_data:/data/movies
      - image_data:/data/images
      - subtitle_data:/data/subtitles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  maven_cache:
  frontend_node_modules:
  movie_data:
  image_data:
  subtitle_data:
