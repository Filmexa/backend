name: Filmexa action

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_TEST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 4

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

     

      - name: Run Test with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean verify
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL_TEST }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SECURITY_JWT_SECRET_KEY: ${{ secrets.SECURITY_JWT_SECRET_KEY }}
          SECURITY_JWT_EXPIRATION_TIME: ${{ secrets.SECURITY_JWT_EXPIRATION_TIME }}
          SECURITY_JWT_REFRESH_EXPIRATION_TIME: ${{ secrets.SECURITY_JWT_REFRESH_EXPIRATION_TIME }}
          OAUTH_42_CLIENT_ID: ${{ secrets.OAUTH_42_CLIENT_ID }}
          OAUTH_42_CLIENT_SECRET: ${{ secrets.OAUTH_42_CLIENT_SECRET }}
          OAUTH_42_REDIRECT_URI: ${{ secrets.OAUTH_42_REDIRECT_URI }}
          OAUTH_42_AUTHORIZE_URL: ${{ secrets.OAUTH_42_AUTHORIZE_URL }}
          OAUTH_42_TOKEN_URL: ${{ secrets.OAUTH_42_TOKEN_URL }}
          OAUTH_42_ME_URL: ${{ secrets.OAUTH_42_ME_URL }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_GOOGLE_REDIRECT_URI: ${{ secrets.OAUTH_GOOGLE_REDIRECT_URI }}
          OAUTH_GOOGLE_AUTHORIZE_URL: ${{ secrets.OAUTH_GOOGLE_AUTHORIZE_URL }}
          OAUTH_GOOGLE_TOKEN_URL: ${{ secrets.OAUTH_GOOGLE_TOKEN_URL }}
          OAUTH_GOOGLE_USERINFO_URL: ${{ secrets.OAUTH_GOOGLE_USERINFO_URL }}
          OAUTH_FACEBOOK_CLIENT_ID: ${{ secrets.OAUTH_FACEBOOK_CLIENT_ID }}
          OAUTH_FACEBOOK_CLIENT_SECRET: ${{ secrets.OAUTH_FACEBOOK_CLIENT_SECRET }}
          OAUTH_FACEBOOK_AUTHORIZE_URL: ${{ secrets.OAUTH_FACEBOOK_AUTHORIZE_URL }}
          OAUTH_FACEBOOK_TOKEN_URL: ${{ secrets.OAUTH_FACEBOOK_TOKEN_URL }}
          OAUTH_FACEBOOK_USERINFO_URL: ${{ secrets.OAUTH_FACEBOOK_USERINFO_URL }}
          OAUTH_FACEBOOK_REDIRECT_URI: ${{ secrets.OAUTH_FACEBOOK_REDIRECT_URI }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          IMG_STORAGE_PATH: ${{ secrets.IMG_STORAGE_PATH }}
          VIDEO_STORAGE_PATH: ${{ secrets.VIDEO_STORAGE_PATH }}
          SUBTITLE_STORAGE_PATH: ${{ secrets.SUBTITLE_STORAGE_PATH }}
          APP_COOKIE_NAME: ${{ secrets.APP_COOKIE_NAME }}
          APP_COOKIE_SECURE: ${{ secrets.APP_COOKIE_SECURE }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          TMDB_IMAGE_BASE_URL: ${{ secrets.TMDB_IMAGE_BASE_URL }}
          SECURITY_VERIFICATION_EXPIRATION_MINUTES: ${{ secrets.SECURITY_VERIFICATION_EXPIRATION_MINUTES }}
          YTS_BASE_URL: ${{ secrets.YTS_BASE_URL }}
          PIRATEBAY_BASE_URL: ${{ secrets.PIRATEBAY_BASE_URL }}
          SUBDL_BAZE_URL: ${{ secrets.SUBDL_BAZE_URL }}
          FFMPEG_PATH: ${{ secrets.FFMPEG_PATH }}
          FFPROBE_PATH: ${{ secrets.FFPROBE_PATH }}
          STREAM_SEGMENT_SECONDS: ${{ secrets.STREAM_SEGMENT_SECONDS }}
          STREAM_PRESET: ${{ secrets.STREAM_PRESET }}
          STREAM_MAX_TRANSCODES: ${{ secrets.STREAM_MAX_TRANSCODES }}
          STREAM_TRANSCODE_TIMEOUT: ${{ secrets.STREAM_TRANSCODE_TIMEOUT }}
          STREAM_PROBE_TIMEOUT: ${{ secrets.STREAM_PROBE_TIMEOUT }}
          STREAM_READAHEAD_SECONDS: ${{ secrets.STREAM_READAHEAD_SECONDS }}
          STREAM_TOKEN_SECRET: ${{ secrets.STREAM_TOKEN_SECRET }}
          STREAM_TOKEN_TTL_MINUTES: ${{ secrets.STREAM_TOKEN_TTL_MINUTES }}
          CLEANUP_RETENTION_DAYS: ${{ secrets.CLEANUP_RETENTION_DAYS }}
          CLEANUP_CRON: ${{ secrets.CLEANUP_CRON }}
          JPA_SHOW_SQL: ${{ secrets.JPA_SHOW_SQL }}
          TORRENT_ACCEPTOR_PORT: ${{ secrets.TORRENT_ACCEPTOR_PORT }}
          TORRENT_DHT_PORT: ${{ secrets.TORRENT_DHT_PORT }}
          TORRENT_TRACKERS: ${{ secrets.TORRENT_TRACKERS }}
          TORRENT_MAX_CONCURRENT_DOWNLOADS: ${{ secrets.TORRENT_MAX_CONCURRENT_DOWNLOADS }}
          TORRENT_DOWNLOAD_QUEUE_CAPACITY: ${{ secrets.TORRENT_DOWNLOAD_QUEUE_CAPACITY }}
          TORRENT_MAX_PEER_CONNECTIONS_PER_DOWNLOAD: ${{ secrets.TORRENT_MAX_PEER_CONNECTIONS_PER_DOWNLOAD }}
          TORRENT_HASHING_THREADS: ${{ secrets.TORRENT_HASHING_THREADS }}
          BT_PEER_LOG_LEVEL: ${{ secrets.BT_PEER_LOG_LEVEL }}
          BT_NET_LOG_LEVEL: ${{ secrets.BT_NET_LOG_LEVEL }}

  build:
    name: Build and Push Docker Image
    needs: test

    # Only build/push after tests passed
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERPASSWORD }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERUSER }}/filmexa-backend:latest
            ${{ secrets.DOCKERUSER }}/filmexa-backend:${{ github.actor }}-${{ github.sha }}

  deploy-code:
    name: deploy to server
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        run: |
          echo "${{ secrets.ORACLE_INSTANCE_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem

          scp -o StrictHostKeyChecking=no -i ssh_key.pem \
            docker-compose.yml ${{ secrets.ORACLE_INSTANCE_USER }}@${{ secrets.ORACLE_INSTANCE_HOST }}:/home/${{ secrets.ORACLE_INSTANCE_USER }}/backend
          
          rm ssh_key.pem

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_INSTANCE_HOST }}
          username: ${{ secrets.ORACLE_INSTANCE_USER }}
          key: ${{ secrets.ORACLE_INSTANCE_KEY }}
          
          script: |
            cd /home/ubuntu/backend
            
            cat << 'EOF' > .env
            SPRING_DATASOURCE_URL= ${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME= ${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD= ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            SECURITY_JWT_SECRET_KEY= ${{ secrets.SECURITY_JWT_SECRET_KEY }}
            SECURITY_JWT_EXPIRATION_TIME= ${{ secrets.SECURITY_JWT_EXPIRATION_TIME }}
            SECURITY_JWT_REFRESH_EXPIRATION_TIME= ${{ secrets.SECURITY_JWT_REFRESH_EXPIRATION_TIME }}
            OAUTH_42_CLIENT_ID= ${{ secrets.OAUTH_42_CLIENT_ID }}
            OAUTH_42_CLIENT_SECRET= ${{ secrets.OAUTH_42_CLIENT_SECRET }}
            OAUTH_42_REDIRECT_URI= ${{ secrets.OAUTH_42_REDIRECT_URI }}
            OAUTH_42_AUTHORIZE_URL= ${{ secrets.OAUTH_42_AUTHORIZE_URL }}
            OAUTH_42_TOKEN_URL= ${{ secrets.OAUTH_42_TOKEN_URL }}
            OAUTH_42_ME_URL= ${{ secrets.OAUTH_42_ME_URL }}
            OAUTH_GOOGLE_CLIENT_ID= ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
            OAUTH_GOOGLE_CLIENT_SECRET= ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
            OAUTH_GOOGLE_REDIRECT_URI= ${{ secrets.OAUTH_GOOGLE_REDIRECT_URI }}
            OAUTH_GOOGLE_AUTHORIZE_URL= ${{ secrets.OAUTH_GOOGLE_AUTHORIZE_URL }}
            OAUTH_GOOGLE_TOKEN_URL= ${{ secrets.OAUTH_GOOGLE_TOKEN_URL }}
            OAUTH_GOOGLE_USERINFO_URL= ${{ secrets.OAUTH_GOOGLE_USERINFO_URL }}
            OAUTH_FACEBOOK_CLIENT_ID=${{ secrets.OAUTH_FACEBOOK_CLIENT_ID }}
            OAUTH_FACEBOOK_CLIENT_SECRET=${{ secrets.OAUTH_FACEBOOK_CLIENT_SECRET }}
            OAUTH_FACEBOOK_AUTHORIZE_URL=${{ secrets.OAUTH_FACEBOOK_AUTHORIZE_URL }}
            OAUTH_FACEBOOK_TOKEN_URL=${{ secrets.OAUTH_FACEBOOK_TOKEN_URL }}
            OAUTH_FACEBOOK_USERINFO_URL=${{ secrets.OAUTH_FACEBOOK_USERINFO_URL }}
            OAUTH_FACEBOOK_REDIRECT_URI=${{ secrets.OAUTH_FACEBOOK_REDIRECT_URI }}
            MAIL_HOST= ${{ secrets.MAIL_HOST }}
            MAIL_PORT= ${{ secrets.MAIL_PORT }}
            MAIL_USERNAME= ${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD= ${{ secrets.MAIL_PASSWORD }}
            CORS_ALLOWED_ORIGINS= ${{ secrets.CORS_ALLOWED_ORIGINS }}
            IMG_STORAGE_PATH= ${{ secrets.IMG_STORAGE_PATH }}
            VIDEO_STORAGE_PATH= ${{ secrets.VIDEO_STORAGE_PATH }}
            SUBTITLE_STORAGE_PATH= ${{ secrets.SUBTITLE_STORAGE_PATH }}
            POSTGRES_DB= ${{ secrets.POSTGRES_DB }}
            POSTGRES_USER= ${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD= ${{ secrets.POSTGRES_PASSWORD }}
            APP_COOKIE_SECURE= ${{ secrets.APP_COOKIE_SECURE }}
            APP_COOKIE_NAME= ${{ secrets.APP_COOKIE_NAME }}
            TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}
            TMDB_BASE_URL=${{ secrets.TMDB_BASE_URL }}
            TMDB_IMAGE_BASE_URL=${{ secrets.TMDB_IMAGE_BASE_URL }}
            SECURITY_VERIFICATION_EXPIRATION_MINUTES=${{ secrets.SECURITY_VERIFICATION_EXPIRATION_MINUTES }}
            YTS_BASE_URL=${{ secrets.YTS_BASE_URL }}
            PIRATEBAY_BASE_URL=${{ secrets.PIRATEBAY_BASE_URL }}
            SUBDL_BAZE_URL=${{ secrets.SUBDL_BAZE_URL }}
            FFMPEG_PATH=${{ secrets.FFMPEG_PATH }}
            FFPROBE_PATH=${{ secrets.FFPROBE_PATH }}
            STREAM_SEGMENT_SECONDS=${{ secrets.STREAM_SEGMENT_SECONDS }}
            STREAM_PRESET=${{ secrets.STREAM_PRESET }}
            STREAM_MAX_TRANSCODES=${{ secrets.STREAM_MAX_TRANSCODES }}
            STREAM_TRANSCODE_TIMEOUT=${{ secrets.STREAM_TRANSCODE_TIMEOUT }}
            STREAM_PROBE_TIMEOUT=${{ secrets.STREAM_PROBE_TIMEOUT }}
            STREAM_READAHEAD_SECONDS=${{ secrets.STREAM_READAHEAD_SECONDS }}
            STREAM_TOKEN_SECRET=${{ secrets.STREAM_TOKEN_SECRET }}
            STREAM_TOKEN_TTL_MINUTES=${{ secrets.STREAM_TOKEN_TTL_MINUTES }}
            CLEANUP_RETENTION_DAYS=${{ secrets.CLEANUP_RETENTION_DAYS }}
            CLEANUP_CRON=${{ secrets.CLEANUP_CRON }}
            JPA_SHOW_SQL=${{ secrets.JPA_SHOW_SQL }}
            TORRENT_ACCEPTOR_PORT=${{ secrets.TORRENT_ACCEPTOR_PORT }}
            TORRENT_DHT_PORT=${{ secrets.TORRENT_DHT_PORT }}
            TORRENT_TRACKERS=${{ secrets.TORRENT_TRACKERS }}
            TORRENT_MAX_CONCURRENT_DOWNLOADS=${{ secrets.TORRENT_MAX_CONCURRENT_DOWNLOADS }}
            TORRENT_DOWNLOAD_QUEUE_CAPACITY=${{ secrets.TORRENT_DOWNLOAD_QUEUE_CAPACITY }}
            TORRENT_MAX_PEER_CONNECTIONS_PER_DOWNLOAD=${{ secrets.TORRENT_MAX_PEER_CONNECTIONS_PER_DOWNLOAD }}
            TORRENT_HASHING_THREADS=${{ secrets.TORRENT_HASHING_THREADS }}
            BT_PEER_LOG_LEVEL=${{ secrets.BT_PEER_LOG_LEVEL }}
            BT_NET_LOG_LEVEL=${{ secrets.BT_NET_LOG_LEVEL }}
            EOF
            
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f 