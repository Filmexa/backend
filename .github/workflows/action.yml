name: Filmexa action

on:
  push:
    branches:
      - main
      - dev
    workflow_dispatch:

jobs:
  test-building-code:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: filmexa_test
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        ports:
          - 5432:5432
        # Tell GitHub to wait until the database is ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

     

      - name: Run Test with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean verify
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SECURITY_JWT_SECRET_KEY: ${{ secrets.SECURITY_JWT_SECRET_KEY }}
          SECURITY_JWT_EXPIRATION_TIME: ${{ secrets.SECURITY_JWT_EXPIRATION_TIME }}
          SECURITY_JWT_REFRESH_EXPIRATION_TIME: ${{ secrets.SECURITY_JWT_REFRESH_EXPIRATION_TIME }}
          OAUTH_42_CLIENT_ID: ${{ secrets.OAUTH_42_CLIENT_ID }}
          OAUTH_42_CLIENT_SECRET: ${{ secrets.OAUTH_42_CLIENT_SECRET }}
          OAUTH_42_REDIRECT_URI: ${{ secrets.OAUTH_42_REDIRECT_URI }}
          OAUTH_42_AUTHORIZE_URL: ${{ secrets.OAUTH_42_AUTHORIZE_URL }}
          OAUTH_42_TOKEN_URL: ${{ secrets.OAUTH_42_TOKEN_URL }}
          OAUTH_42_ME_URL: ${{ secrets.OAUTH_42_ME_URL }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_GOOGLE_REDIRECT_URI: ${{ secrets.OAUTH_GOOGLE_REDIRECT_URI }}
          OAUTH_GOOGLE_AUTHORIZE_URL: ${{ secrets.OAUTH_GOOGLE_AUTHORIZE_URL }}
          OAUTH_GOOGLE_TOKEN_URL: ${{ secrets.OAUTH_GOOGLE_TOKEN_URL }}
          OAUTH_GOOGLE_USERINFO_URL: ${{ secrets.OAUTH_GOOGLE_USERINFO_URL }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          IMG_STORAGE_PATH: ${{ secrets.IMG_STORAGE_PATH }}
          VIDEO_STORAGE_PATH: ${{ secrets.VIDEO_STORAGE_PATH }}
          SUBTITLE_STORAGE_PATH: ${{ secrets.SUBTITLE_STORAGE_PATH }}
      - name: Build and Push docker image
        run: |
            docker login -u ${{ secrets.dockeruser }} -p ${{ secrets.dockerpassword }}